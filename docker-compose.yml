services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql-data:/var/lib/mysql

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"   # ingestion (Serilog sink)
      - "8081:80"     # web UI -> http://localhost:8081
    volumes:
      - seq-data:/data

  api:
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=mydb;Uid=root;Pwd=root123;SslMode=None;AllowPublicKeyRetrieval=true;"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  seq-data:
